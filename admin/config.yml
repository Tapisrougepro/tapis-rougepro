backend:
  name: github
  repo: Tapisrougepro/tapis-rougepro
  branch: main
media_folder: "public/uploads"
public_folder: "/uploads"
site_url: https://tapisrougepro.ca

collections:
    - name: "pages"
    label: "Pages"
    files:
            - name: "home"
        label: "Accueil"
        file: "content/home.md"
        fields:
                    - {label: "Titre", name: "title", widget: "string"}
                    - {label: "Contenu", name: "body", widget: "markdown"}
